{% load l10n %}
{% for field in form %}
<div>
    <label for="{{ field.id_for_label }}" class="nb-label">{{ field.label }}</label>
    {% if field.name == 'category' %}
    <select name="category" id="{{ field.id_for_label }}" class="nb-select">
        {% for value, label in field.field.choices %}<option value="{{ value }}" {% if field.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    {% elif field.name == 'notes' %}
    <textarea name="notes" id="{{ field.id_for_label }}" rows="2" class="nb-textarea">{{ field.value|default_if_none:'' }}</textarea>
    {% elif field.name == 'due_date' or field.name == 'paid_at' %}
    <input type="date" name="{{ field.html_name }}" id="{{ field.id_for_label }}" {% if field.field.required %}required{% endif %}
        value="{% if field.value.year %}{{ field.value|date:'Y-m-d' }}{% else %}{{ field.value|default_if_none:'' }}{% endif %}" class="nb-input">
    {% elif field.name == 'amount' %}
    <input type="number" step="0.01" min="0.01" name="amount" id="{{ field.id_for_label }}" required value="{{ field.value|default_if_none:''|unlocalize }}" class="nb-input tabular">
    {% else %}
    <input name="{{ field.html_name }}" id="{{ field.id_for_label }}" {% if field.field.required %}required{% endif %} value="{{ field.value|default_if_none:'' }}" class="nb-input" autocomplete="off">
    {% endif %}
    {% for error in field.errors %}<p class="nb-error">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
