{% for name, label, icon, key in admin_nav %}
<a href="{% url name %}" class="admin-link {% if active_menu == key %}active{% endif %} flex items-center gap-3 px-4 py-2.5 rounded-2xl font-extrabold text-sm transition-all whitespace-nowrap">
    <i class="bi {{ icon }} text-lg"></i>{{ label }}
</a>
{% endfor %}
