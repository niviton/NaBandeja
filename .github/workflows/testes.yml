name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      AUTOBAHN_USE_NVX: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes restaurante central nabandeja_project scripts
      - name: Verificar configuracao e migracoes
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          NABANDEJA_MULTI_LOJA=1 python manage.py makemigrations --check --dry-run
      - name: Rodar testes
        run: coverage run manage.py test restaurante && coverage report --skip-covered --include="restaurante/*"
      - name: Rodar testes do modo varias lojas
        env:
          NABANDEJA_MULTI_LOJA: "1"
        run: python manage.py test central
